<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Chord Explorer – Full Fretboard Positions A–G</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --accent:#4ecdc4; --text:#e8eef5; --muted:#8b9bb4; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); padding:1.5rem; line-height:1.45; }
  h1 { font-size:1.6rem; margin-bottom:.3rem; }
  .sub { color:var(--muted); margin-bottom:1.2rem; font-size:.95rem; }
  .controls { display:flex; flex-wrap:wrap; gap:.8rem; align-items:center; margin-bottom:1.5rem; }
  input, select, button {
    background:var(--card); border:1px solid #2a3a4f; color:var(--text);
    padding:.55rem .9rem; border-radius:8px; font-size:1rem;
  }
  input { min-width:180px; }
  button { background:var(--accent); color:#0f1419; font-weight:600; cursor:pointer; border:none; }
  button:hover { filter:brightness(1.1); }
  .quick { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; }
  .quick button { background:#243044; color:var(--text); font-size:.85rem; padding:.35rem .65rem; }
  #results { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1.2rem; }
  .chord-card {
    background:var(--card); border-radius:12px; padding:1rem; text-align:center;
    border:1px solid #2a3a4f;
  }
  .chord-card h3 { font-size:1.1rem; margin-bottom:.6rem; color:var(--accent); }
  .chord-card .pos { font-size:.8rem; color:var(--muted); margin-bottom:.4rem; }
  svg { max-width:100%; height:auto; }
  .empty { color:var(--muted); grid-column:1/-1; padding:2rem; text-align:center; }
  footer { margin-top:2rem; font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
  <h1>🎸 Guitar Chord Explorer</h1>
  <p class="sub">A–G roots + variations • multiple positions across the fretboard</p>

  <div class="controls">
    <input id="search" type="text" placeholder="e.g. Am, Cmaj7, G7, F#m…" autocomplete="off">
    <select id="root">
      <option value="">All roots</option>
      <option>A</option><option>A#</option><option>Bb</option>
      <option>B</option>
      <option>C</option><option>C#</option><option>Db</option>
      <option>D</option><option>D#</option><option>Eb</option>
      <option>E</option>
      <option>F</option><option>F#</option><option>Gb</option>
      <option>G</option><option>G#</option><option>Ab</option>
    </select>
    <select id="type">
      <option value="">All types</option>
      <option value="major">Major</option>
      <option value="minor">Minor</option>
      <option value="7">Dominant 7</option>
      <option value="maj7">Major 7</option>
      <option value="m7">Minor 7</option>
      <option value="sus2">Sus2</option>
      <option value="sus4">Sus4</option>
      <option value="dim">Dim</option>
      <option value="aug">Aug</option>
      <option value="5">Power (5)</option>
      <option value="6">6</option>
      <option value="m6">m6</option>
      <option value="9">9</option>
      <option value="add9">add9</option>
    </select>
    <button onclick="render()">Show</button>
  </div>

  <div class="quick" id="quick"></div>
  <div id="results"></div>

  <footer>
    Data based on common open + barre/movable shapes (CAGED-derived + standard library positions).  
    Diagrams show frets relative to the starting position; “X” = mute, “0” = open.
  </footer>

function normalize(q) {
  q = q.trim().toLowerCase().replace(/\s+/g,"");
  // common aliases
  const map = {
    "a":"A major","am":"A minor","a7":"A7","amaj7":"Amaj7","am7":"Am7",
    "bb":"Bb major","bbm":"Bb minor","a#":"Bb major","a#m":"Bb minor",
    "b":"B major","bm":"B minor","b7":"B7","bm7":"Bm7","bmaj7":"Bmaj7",
    "c":"C major","cm":"C minor","c7":"C7","cmaj7":"Cmaj7","cm7":"Cm7",
    "c#":"C# major","c#m":"C# minor","db":"Db major","dbm":"Db minor",
    "d":"D major","dm":"D minor","d7":"D7","dmaj7":"Dmaj7","dm7":"Dm7",
    "eb":"Eb major","ebm":"Eb minor","d#":"Eb major","d#m":"Eb minor",
    "e":"E major","em":"E minor","e7":"E7","emaj7":"Emaj7","em7":"Em7",
    "f":"F major","fm":"F minor","f7":"F7","fmaj7":"Fmaj7","fm7":"Fm7",
    "f#":"F# major","f#m":"F# minor","gb":"Gb major","gbm":"Gb minor",
    "g":"G major","gm":"G minor","g7":"G7","gmaj7":"Gmaj7","gm7":"Gm7",
    "g#":"G# major","g#m":"G# minor","ab":"Ab major","abm":"Ab minor"
  };
  if (map[q]) return map[q];
  // try fuzzy match
  for (const k of Object.keys(DB)) {
    if (k.toLowerCase().replace(/\s+/g,"") === q) return k;
  }
  return q;
}

function renderChordSVG(pos, title) {
  const frets = pos.frets;
  const fingers = pos.fingers || [];
  const base = pos.baseFret || 1;
  const barres = pos.barres || [];
  const fretCount = 5;
  const w = 160, h = 180;
  const left = 30, top = 30;
  const stringGap = 20, fretGap = 28;

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="160" height="180" xmlns="http://www.w3.org/2000/svg">`;
  // nut / base fret label
  if (base === 1) {
    svg += `<rect x="${left-2}" y="${top-4}" width="${5*stringGap+4}" height="4" fill="#e8eef5"/>`;
  } else {
    svg += `<text x="${left-18}" y="${top+14}" fill="#8b9bb4" font-size="11">${base}</text>`;
  }
  // strings
  for (let s=0; s<6; s++) {
    svg += `<line x1="${left+s*stringGap}" y1="${top}" x2="${left+s*stringGap}" y2="${top+fretCount*fretGap}" stroke="#8b9bb4" stroke-width="1.5"/>`;
  }
  // frets
  for (let f=0; f<=fretCount; f++) {
    svg += `<line x1="${left}" y1="${top+f*fretGap}" x2="${left+5*stringGap}" y2="${top+f*fretGap}" stroke="#8b9bb4" stroke-width="${f===0?2:1}"/>`;
  }
  // muted / open markers above nut
  for (let s=0; s<6; s++) {
    const f = frets[s];
    const x = left + s*stringGap;
    if (f === -1) {
      svg += `<text x="${x}" y="${top-10}" text-anchor="middle" fill="#e74c3c" font-size="14" font-weight="bold">×</text>`;
    } else if (f === 0) {
      svg += `<circle cx="${x}" cy="${top-12}" r="5" fill="none" stroke="#4ecdc4" stroke-width="2"/>`;
    }
  }
  // finger dots
  for (let s=0; s<6; s++) {
    let f = frets[s];
    if (f === undefined || f <= 0) continue;
    const rel = f - (base === 1 ? 0 : base - 1);
    if (rel < 1 || rel > fretCount) continue;
    const x = left + s*stringGap;
    const y = top + (rel - 0.5)*fretGap;
    svg += `<circle cx="${x}" cy="${y}" r="9" fill="#4ecdc4"/>`;
    const finger = fingers[s];
    if (finger && finger > 0) {
      svg += `<text x="${x}" y="${y+4}" text-anchor="middle" fill="#0f1419" font-size="11" font-weight="700">${finger}</text>`;
    }
  }
  // simple barre indication (horizontal line at first barre fret)
  if (barres.length) {
    const bf = barres[0];
    const rel = bf - (base === 1 ? 0 : base - 1);
    if (rel >= 1 && rel <= fretCount) {
      const y = top + (rel - 0.5)*fretGap;
      svg += `<line x1="${left}" y1="${y}" x2="${left+5*stringGap}" y2="${y}" stroke="#4ecdc4" stroke-width="6" opacity="0.35"/>`;
    }
  }
  svg += `</svg>`;
  return svg;
}

function render() {
  const q = document.getElementById("search").value;
  const rootFilter = document.getElementById("root").value;
  const typeFilter = document.getElementById("type").value;
  const results = document.getElementById("results");
  results.innerHTML = "";

  let keys = Object.keys(DB);
  if (q) {
    const norm = normalize(q);
    keys = keys.filter(k => k.toLowerCase().includes(norm.toLowerCase()) || 
                           k.toLowerCase().replace(/\s+/g,"") === norm.toLowerCase().replace(/\s+/g,""));
    // also try exact
    if (DB[norm]) keys = [norm];
  }
  if (rootFilter) {
    keys = keys.filter(k => k.startsWith(rootFilter) || 
                           (rootFilter==="A#" && k.startsWith("Bb")) ||
                           (rootFilter==="Bb" && k.startsWith("A#")) ||
                           (rootFilter==="C#" && k.startsWith("Db")) ||
                           (rootFilter==="Db" && k.startsWith("C#")) ||
                           (rootFilter==="D#" && k.startsWith("Eb")) ||
                           (rootFilter==="Eb" && k.startsWith("D#")) ||
                           (rootFilter==="F#" && k.startsWith("Gb")) ||
                           (rootFilter==="Gb" && k.startsWith("F#")) ||
                           (rootFilter==="G#" && k.startsWith("Ab")) ||
                           (rootFilter==="Ab" && k.startsWith("G#")));
  }
  if (typeFilter) {
    keys = keys.filter(k => {
      const lower = k.toLowerCase();
      if (typeFilter === "major") return lower.endsWith(" major") && !lower.includes("minor");
      if (typeFilter === "minor") return lower.includes("minor") && !lower.includes("m7") && !lower.includes("m6");
      return lower.includes(typeFilter);
    });
  }

  if (!keys.length) {
    results.innerHTML = `<div class="empty">No matching chords. Try Am, Cmaj7, G7, F#m, Bb…</div>`;
    return;
  }

  keys.sort().forEach(name => {
    const positions = DB[name];
    positions.forEach((pos, i) => {
      const card = document.createElement("div");
      card.className = "chord-card";
      card.innerHTML = `
        <h3>${name}</h3>
        <div class="pos">Position ${i+1} • base fret ${pos.baseFret||1}</div>
        ${renderChordSVG(pos, name)}
      `;
      results.appendChild(card);
    });
  });
}

// Enter key
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key === "Enter") render();
});
document.getElementById("root").addEventListener("change", render);
document.getElementById("type").addEventListener("change", render);

// initial
render();
</script>
